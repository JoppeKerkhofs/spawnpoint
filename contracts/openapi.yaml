openapi: 3.1.0
info:
  title: Minecraft Panel API
  version: "1"
  description: >
    Lets other apps use the panel. Create a token under Settings, API tokens, and send it
    as a bearer token. A token can never do more than its owner's role allows.
servers:
  - url: /api/v1
security:
  - token: []
paths:
  /servers:
    get:
      summary: List the servers the token's owner may see, with their live state
      description: Needs the servers:read ability. A viewer gets only the servers shared with them.
      responses:
        "200":
          description: The servers, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [service_online, data]
                properties:
                  service_online:
                    type: boolean
                    description: False when the Rust service did not answer; states are then "unknown".
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
        "401": { description: No valid token }
        "403": { description: The token lacks servers:read }
        "429": { description: More than 60 requests in a minute }
  /servers/{slug}:
    get:
      summary: Show one server with its live state, players and resource use
      description: Needs servers:read. A viewer can only ask for a server shared with them.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Server" }
        "403": { description: The token lacks servers:read, or the server is not shared with its owner }
        "404": { description: No such server }
  /servers/{slug}/console:
    get:
      summary: Get the WebSocket address of the live console
      description: >
        Needs console:use. The address holds a token that is valid for one minute, so connect at once.
        The socket sends JSON frames: {t: "log", d: text}, {t: "stats", cpu, memory, memory_limit},
        {t: "history", d: [samples]}, {t: "players", d: {online, max, names}} and {t: "out", d: text} for
        the answer to a command. Send a command as a plain text frame; it is ignored unless "write" is true.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Where to connect
          content:
            application/json:
              schema:
                type: object
                required: [url, write]
                properties:
                  url: { type: string, examples: ["wss://panel.example.com/node/servers/survival/console?token=..."] }
                  write: { type: boolean, description: True when the token's owner is an admin. }
        "403": { description: The token lacks console:use, or the server is not shared with its owner }
  /servers/{slug}/logs:
    get:
      summary: List the log files, or read one
      description: Needs logs:read. Without "file" it lists the files; with it, it returns that file as text.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: file, in: query, schema: { type: string, examples: [latest.log, 2026-11-14-1.log.gz] } }
        - { name: q, in: query, description: Only lines containing this text., schema: { type: string } }
      responses:
        "200":
          description: Either "files", or "file" and "content"
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size: { type: integer }
                        modified: { type: integer, description: Unix seconds. }
                  file: { type: string }
                  content: { type: string }
        "403": { description: The token lacks logs:read, or the server is not shared with its owner }
        "422": { description: Not a log file name }
  /servers/{slug}/backups:
    get:
      summary: List the backups, newest first
      description: Needs backups:manage and an admin owner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The backups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, examples: ["1794600000.tar.gz"] }
                        size: { type: integer }
                        created: { type: integer, description: Unix seconds. }
                        locked: { type: boolean }
        "403": { description: The token lacks backups:manage, or its owner is not an admin }
    post:
      summary: Start a backup
      description: Needs backups:manage and an admin owner. The backup runs in the background.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { description: The token lacks backups:manage, or its owner is not an admin }
        "502": { description: The Rust service did not answer or refused }
  /servers/{slug}/files:
    get:
      summary: List a folder, or read a text file
      description: >
        Needs files:read and an admin owner. With "file=1" the path is read as a text file of up to
        1 MB; otherwise it is listed as a folder.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, description: Inside the server's folder; empty for its top., schema: { type: string } }
        - { name: file, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Either "entries", or "content"
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        dir: { type: boolean }
                        size: { type: integer, description: Bytes, or the number of items for a folder. }
                        modified: { type: integer, description: Unix seconds. }
                  content: { type: string }
        "403": { description: The token lacks files:read, its owner is not an admin, or the path leaves the folder }
        "404": { description: No such file or folder }
        "413": { description: Too large to read as text; download it instead }
        "415": { description: Not a text file }
        "422": { description: Not a path inside the server's folder }
    put:
      summary: Write a text file
      description: Needs files:write and an admin owner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                content: { type: string, maxLength: 1048576 }
      responses:
        "200": { description: Saved }
        "403": { description: The token lacks files:write, or its owner is not an admin }
        "409": { description: The folder is missing, or the path is a folder }
    delete:
      summary: Delete a file, or a folder with everything in it
      description: Needs files:write and an admin owner.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { description: The token lacks files:write, or its owner is not an admin }
        "404": { description: No such file or folder }
  /servers/{slug}/files/transfer:
    get:
      summary: Get addresses for uploading and downloading files of any size
      description: >
        Needs files:write and an admin owner. Both addresses hold a token that is valid for five
        minutes. Upload with PUT to the upload address plus "&path=<folder>&name=<file name>" and the
        file as the body; download with GET from the download address plus "&path=<file>".
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The two addresses
          content:
            application/json:
              schema:
                type: object
                required: [upload, download]
                properties:
                  upload: { type: string }
                  download: { type: string }
        "403": { description: The token lacks files:write, or its owner is not an admin }
  /servers/{slug}/power/{action}:
    post:
      summary: Start, stop, restart or kill a server
      description: Needs the servers:power ability and an admin owner. The action runs in the background.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, restart, kill] }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { description: No valid token }
        "403": { description: The token lacks servers:power, or its owner is not an admin }
        "404": { description: No such server or action }
        "409": { description: The server is busy with another task }
        "502": { description: The Rust service did not answer or refused }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  schemas:
    Server:
      type: object
      required: [slug, name, hostname, server_type, mc_version, state, detail, players, usage]
      properties:
        slug: { type: string, examples: [survival] }
        name: { type: string }
        hostname: { type: string, examples: [survival.mc.example.com] }
        server_type:
          type: string
          enum: [VANILLA, PAPER, FABRIC, FORGE, NEOFORGE, MODRINTH, AUTO_CURSEFORGE, FTBA]
        mc_version: { type: string, examples: [LATEST, "1.21.10"] }
        state:
          type: string
          enum: [running, starting, stopping, restarting, installing, "backing up", restoring, importing, deleting, offline, error, unknown]
        detail:
          type: [string, "null"]
          description: Why the server is in an error state, when known.
        players:
          type: [object, "null"]
          description: Only for a running server that answers.
          properties:
            online: { type: integer }
            max: { type: integer }
            names: { type: array, items: { type: string }, description: At most a dozen. }
        usage:
          type: [object, "null"]
          description: The latest sample of a running server.
          properties:
            at: { type: integer, description: Unix seconds. }
            cpu: { type: number, description: Percent of one core. }
            memory: { type: integer, description: Bytes. }
            memory_limit: { type: integer, description: Bytes. }
        disk_bytes:
          type: [integer, "null"]
          description: Size of the server's folder, measured about once a minute while it runs.
        last_backup:
          type: [integer, "null"]
          description: Unix seconds of the newest backup.
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
