[package]
name = "spawnpoint-node"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bollard = "0.21.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "process", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
