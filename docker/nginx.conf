map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;
    server_tokens off;
    client_max_body_size 20m;

    # Hashed file names, so they can be cached for good.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The browser talks to the Rust service only for what a token authorises:
    # the live console, uploads and downloads. Its signed API stays inside the container.
    location ~ ^/node/(servers/[^/]+/(console|upload|download|backups/[^/]+/download))$ {
        proxy_pass http://127.0.0.1:8080/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Uploads and downloads are streamed, whatever their size.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Debian's fastcgi_params passes the host without its port, which breaks links on any port but 80.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
