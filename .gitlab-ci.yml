# Tests both halves, then builds the panel image and the node image. From the default branch they
# are pushed to this project's container registry, as "latest" and as the version in panel/composer.json.

stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

panel:
  stage: test
  image: php:8.5-cli-bookworm
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git unzip
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y --no-install-recommends nodejs
    - curl -fsSL https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd panel
  script:
    - composer setup
    - composer ci:check

service:
  stage: test
  image: rust:1-slim-bookworm
  script:
    - cd service
    - cargo test --locked

# Every merge publishes the image under the version in panel/composer.json, so a
# merge request has to raise it.
version:
  stage: test
  image:
    name: alpine/git
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - sh scripts/check-version.sh FETCH_HEAD

image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      # The panel, and the node as "<project>/node".
      - IMAGE: $CI_REGISTRY_IMAGE
        CONTEXT: .
      - IMAGE: $CI_REGISTRY_IMAGE/node
        CONTEXT: service
  script:
    - |
      VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' panel/composer.json | head -n 1)
    - docker build --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$CONTEXT"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE:$VERSION"
        docker push "$IMAGE:latest"
      fi
